# Desenvolvimento/teste local: builda as imagens a partir do código.
# Frontend em http://localhost:5173 (proxy /api -> backend). Configuração
# (CS_SECRET_KEY, CS_SMTP_*...) vem de backend/.env.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    volumes:
      - cs_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  cs_data:
